name: Publisher smoke

on:
  workflow_dispatch:
    inputs:
      summary:
        description: Reviewed three-to-seven-bullet pickleball changelog
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publisher-smoke
  cancel-in-progress: false

env:
  PROJECT_NAME: ShotStep publisher proof
  VERSION: publisher-smoke-${{ github.run_id }}-${{ github.run_attempt }}
  PROFILE: personal
  TRIGGER: hosted publisher smoke
  SUMMARY: ${{ inputs.summary }}
  PLATFORM: ios
  SLACK_CHANNEL_ID: ${{ vars.RELEASE_SLACK_CHANNEL_ID }}

jobs:
  publisher-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7
        with:
          node-version: "24"

      - id: candidate
        name: Record candidate and runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          echo "candidate_commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          {
            echo "### Hosted publisher proof"
            echo
            echo "- Candidate commit: \`${{ github.sha }}\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Runtime: \`$(node --version)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require configured destination
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SLACK_BOT_TOKEN"
          test -n "$SLACK_CHANNEL_ID"

      - id: changelog_contract
        name: Validate hosted changelog rendering
        shell: bash
        run: |
          set -euo pipefail
          BULLET_COUNT=$(printf '%s\n' "$SUMMARY" | awk '/^- / { count += 1 } END { print count + 0 }')
          test "$BULLET_COUNT" -ge 3
          test "$BULLET_COUNT" -le 7
          SLACK_TEXT=$(node scripts/payload-cli.mjs slack-open)
          RENDERED="$SLACK_TEXT" node -e '
            const summary = process.env.SUMMARY;
            const rendered = process.env.RENDERED;
            const normalized = summary.replace(/\r?\n+$/u, "");
            const escaped = normalized
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replace(/@(channel|here|everyone)\b/giu, "@\u200b$1");
            if (!normalized.includes("\n") || !rendered.includes(escaped) || rendered.length > 4000) {
              process.exit(1);
            }
          '
          echo "multiline_summary_validated=true" >> "$GITHUB_OUTPUT"

          ESCAPE_SUMMARY='- Coaches keep third-shot drop notes for @here without broadcasting <all courts> & spectators.'
          ESCAPED=$(SUMMARY="$ESCAPE_SUMMARY" node scripts/payload-cli.mjs slack-open)
          RENDERED="$ESCAPED" node -e '
            const rendered = process.env.RENDERED;
            if (rendered.includes("@here") || rendered.includes("<all courts>") || !rendered.includes("&amp;")) {
              process.exit(1);
            }
          '
          echo "escaping_validated=true" >> "$GITHUB_OUTPUT"

          LONG_SUMMARY=$(node -e 'process.stdout.write("- " + "serve return ".repeat(500))')
          LONG_RENDERED=$(SUMMARY="$LONG_SUMMARY" node scripts/payload-cli.mjs slack-open)
          RENDERED="$LONG_RENDERED" node -e '
            const rendered = process.env.RENDERED;
            if (rendered.length !== 4000 || !rendered.endsWith("…")) process.exit(1);
          '
          echo "length_limit_validated=true" >> "$GITHUB_OUTPUT"

      - id: slack_root
        name: Open Slack proof thread
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(node scripts/payload-cli.mjs slack-open)
          SLACK_TEXT="$SLACK_TEXT" node scripts/slack-cli.mjs open

      - name: Require Slack proof thread
        shell: bash
        env:
          SLACK_THREAD_TS: ${{ steps.slack_root.outputs.thread_ts }}
        run: |
          set -euo pipefail
          test -n "$SLACK_THREAD_TS"

      - name: Publish build-triggered proof
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_THREAD_TS: ${{ steps.slack_root.outputs.thread_ts }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=build STATUS=triggered node scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node scripts/slack-cli.mjs reply

      - name: Publish build-completed proof
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_THREAD_TS: ${{ steps.slack_root.outputs.thread_ts }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=build STATUS=completed URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" node scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node scripts/slack-cli.mjs reply

      - name: Publish submit-triggered proof
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_THREAD_TS: ${{ steps.slack_root.outputs.thread_ts }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=submit STATUS=triggered node scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node scripts/slack-cli.mjs reply

      - name: Publish submit-completed proof
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_THREAD_TS: ${{ steps.slack_root.outputs.thread_ts }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=submit STATUS=completed node scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node scripts/slack-cli.mjs reply

      - name: Publish final proof
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_THREAD_TS: ${{ steps.slack_root.outputs.thread_ts }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(OK=true STAGE="" node scripts/payload-cli.mjs slack-final)
          SLACK_TEXT="$SLACK_TEXT" node scripts/slack-cli.mjs reply

      - id: slack_warning
        name: Prove Slack warning remains best effort
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: invalid-proof-channel
          SLACK_TEXT: Expected failure-path proof for the ShotStep release publisher.
        run: |
          set -euo pipefail
          node scripts/slack-cli.mjs open
          echo "warning_path_completed=true" >> "$GITHUB_OUTPUT"

      - name: Confirm Slack warning did not fail the proof
        shell: bash
        env:
          MULTILINE_SUMMARY_VALIDATED: ${{ steps.changelog_contract.outputs.multiline_summary_validated }}
          ESCAPING_VALIDATED: ${{ steps.changelog_contract.outputs.escaping_validated }}
          LENGTH_LIMIT_VALIDATED: ${{ steps.changelog_contract.outputs.length_limit_validated }}
          WARNING_PATH_COMPLETED: ${{ steps.slack_warning.outputs.warning_path_completed }}
        run: |
          set -euo pipefail
          test "$MULTILINE_SUMMARY_VALIDATED" = "true"
          test "$ESCAPING_VALIDATED" = "true"
          test "$LENGTH_LIMIT_VALIDATED" = "true"
          test "$WARNING_PATH_COMPLETED" = "true"
          {
            echo "- Supplied multiline changelog: rendered and posted as the root"
            echo "- Slack escaping and 4,000-character limit: validated"
            echo "- Slack lifecycle: one root plus five replies"
            echo "- Slack failure path: warning recorded; proof continued"
            echo "- No EAS build or submission was started."
          } >> "$GITHUB_STEP_SUMMARY"
