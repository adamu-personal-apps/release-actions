name: Expo release

on:
  workflow_call:
    inputs:
      project_name: { type: string, required: true }
      profile: { type: string, required: true } # Display label only; never controls notification routing.
      platform: { type: string, default: ios } # Legacy mobile selection: ios | android | all.
      artifacts: { type: string, required: false } # Canonical subset: ios,android,site.
      business_owner: { type: string, required: false } # Expo manifest owner that uses Slack.
      build_profile: { type: string, default: production }
      submit_profile: { type: string, default: production }
      version: { type: string, required: false }
      summary: { type: string, required: false }
      mobile_version: { type: string, required: false }
      site_version: { type: string, required: false }
      mobile_summary: { type: string, required: false }
      site_summary: { type: string, required: false }
      ios_artifact_name: { type: string, required: false }
      android_artifact_name: { type: string, required: false }
      site_artifact_name: { type: string, required: false }
      skip_build: { type: boolean, default: false }
      slack_channel_id: { type: string, required: false }
      site_build_command: { type: string, required: false }
      site_output_directory: { type: string, required: false }
      site_package_directory: { type: string, required: false }
      site_project_name: { type: string, required: false }
      site_deployment_branch: { type: string, required: false }
      site_production_branch: { type: string, required: false }
      site_android_release_sha256: { type: string, required: false }
      site_supabase_url: { type: string, required: false }
      site_supabase_publishable_key: { type: string, required: false }
    secrets:
      EXPO_TOKEN: { required: false }
      SLACK_BOT_TOKEN: { required: false }
      DISCORD_WEBHOOK_URL: { required: false }
      ANDROID_SERVICE_ACCOUNT_JSON: { required: false }
      CLOUDFLARE_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }

env:
  ACTIONS_REPO: adamu-personal-apps/release-actions
  ACTIONS_REF: 07d93532cff1c94a53eff708a1da2dbca35af5aa

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      artifacts: ${{ steps.plan.outputs.artifacts }}
      mobile_platforms: ${{ steps.plan.outputs.mobile_platforms }}
      notification_publisher: ${{ steps.plan.outputs.notification_publisher }}
      release_plan: ${{ steps.artifact_releases.outputs.release_plan }}
      should_deploy_site: ${{ steps.plan.outputs.should_deploy_site }}
      summary: ${{ steps.sum.outputs.summary }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with: { fetch-depth: 0 }
      - name: Checkout release-actions tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          repository: ${{ env.ACTIONS_REPO }}
          ref: ${{ env.ACTIONS_REF }}
          path: .tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7
        with:
          node-version: "24"
      - name: Install project dependencies
        run: .tools/scripts/install-project-deps.sh
      - id: ver
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -n "$IN_VERSION" ]; then V="$IN_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then V="${REF_NAME#v}"
          else V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - id: sum
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          IN_SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          CURRENT_TAG="v${VERSION}"
          if git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then REF="$CURRENT_TAG"; else REF="HEAD"; fi
          if PREV=$(git describe --tags --abbrev=0 "${REF}^" 2>/dev/null); then RANGE="${PREV}..${REF}"; else RANGE="${REF}"; fi
          git log "$RANGE" --pretty=format:'%s' | node .tools/scripts/release-summary-output.mjs
      - id: plan
        name: Resolve artifact plan and notification publisher
        shell: bash
        env:
          INPUT_ARTIFACTS: ${{ inputs.artifacts }}
          INPUT_BUSINESS_OWNER: ${{ inputs.business_owner }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          APP_CONFIG=$(npx --no-install expo config --type public --json)
          EXPO_OWNER=$(printf '%s' "$APP_CONFIG" | jq -er '.owner | select(type == "string" and length > 0)')
          PROJECT_MANIFEST_OWNER=$(jq -r '.owner // empty' project-manifest.json 2>/dev/null || true)
          PLAN=$(EXPO_OWNER="$EXPO_OWNER" PROJECT_MANIFEST_OWNER="$PROJECT_MANIFEST_OWNER" node .tools/scripts/release-artifact-routing.mjs)
          artifacts=$(printf '%s' "$PLAN" | jq -c '.artifacts')
          mobile_platforms=$(printf '%s' "$PLAN" | jq -c '.mobilePlatforms')
          should_deploy_site=$(printf '%s' "$PLAN" | jq -r '.shouldDeploySite')
          notification_publisher=$(printf '%s' "$PLAN" | jq -r '.notificationPublisher')
          echo "artifacts=$artifacts" >> "$GITHUB_OUTPUT"
          echo "mobile_platforms=$mobile_platforms" >> "$GITHUB_OUTPUT"
          echo "should_deploy_site=$should_deploy_site" >> "$GITHUB_OUTPUT"
          echo "notification_publisher=$notification_publisher" >> "$GITHUB_OUTPUT"
      - id: artifact_releases
        name: Pair each artifact with its release identity and changes
        shell: bash
        env:
          ANDROID_ARTIFACT_NAME: ${{ inputs.android_artifact_name }}
          ARTIFACTS_JSON: ${{ steps.plan.outputs.artifacts }}
          IOS_ARTIFACT_NAME: ${{ inputs.ios_artifact_name }}
          LEGACY_SUMMARY: ${{ steps.sum.outputs.summary }}
          LEGACY_VERSION: ${{ steps.ver.outputs.version }}
          MOBILE_SUMMARY: ${{ inputs.mobile_summary }}
          MOBILE_VERSION: ${{ inputs.mobile_version }}
          PROJECT_NAME: ${{ inputs.project_name }}
          SITE_ARTIFACT_NAME: ${{ inputs.site_artifact_name }}
          SITE_SUMMARY: ${{ inputs.site_summary }}
          SITE_VERSION: ${{ inputs.site_version }}
        run: |
          set -euo pipefail
          RELEASE_PLAN=$(node .tools/scripts/artifact-release-plan.mjs)
          echo "release_plan=$RELEASE_PLAN" >> "$GITHUB_OUTPUT"

  announce:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      android_discord_thread_id: ${{ steps.open_android.outputs.thread_id }}
      android_slack_thread_ts: ${{ steps.open_android.outputs.thread_ts }}
      ios_discord_thread_id: ${{ steps.open_ios.outputs.thread_id }}
      ios_slack_thread_ts: ${{ steps.open_ios.outputs.thread_ts }}
      site_discord_thread_id: ${{ steps.open_site.outputs.thread_id }}
      site_slack_thread_ts: ${{ steps.open_site.outputs.thread_ts }}
    steps:
      - name: Checkout release-actions tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          repository: ${{ env.ACTIONS_REPO }}
          ref: ${{ env.ACTIONS_REF }}
          path: .tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7
        with:
          node-version: "24"
      - id: open_ios
        name: Open iOS release notification thread
        if: ${{ contains(fromJSON(needs.prepare.outputs.mobile_platforms), 'ios') }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          RELEASE_PLAN: ${{ needs.prepare.outputs.release_plan }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME=$(printf '%s' "$RELEASE_PLAN" | jq -er '.ios.name')
          VERSION=$(printf '%s' "$RELEASE_PLAN" | jq -er '.ios.version')
          SUMMARY=$(printf '%s' "$RELEASE_PLAN" | jq -er '.ios.summary')
          ARTIFACT=ios ARTIFACT_NAME="$ARTIFACT_NAME" VERSION="$VERSION" SUMMARY="$SUMMARY" \
            node .tools/scripts/release-notifier.mjs open
      - id: open_android
        name: Open Android release notification thread
        if: ${{ contains(fromJSON(needs.prepare.outputs.mobile_platforms), 'android') }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          RELEASE_PLAN: ${{ needs.prepare.outputs.release_plan }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME=$(printf '%s' "$RELEASE_PLAN" | jq -er '.android.name')
          VERSION=$(printf '%s' "$RELEASE_PLAN" | jq -er '.android.version')
          SUMMARY=$(printf '%s' "$RELEASE_PLAN" | jq -er '.android.summary')
          ARTIFACT=android ARTIFACT_NAME="$ARTIFACT_NAME" VERSION="$VERSION" SUMMARY="$SUMMARY" \
            node .tools/scripts/release-notifier.mjs open
      - id: open_site
        name: Open website release notification thread
        if: ${{ needs.prepare.outputs.should_deploy_site == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          RELEASE_PLAN: ${{ needs.prepare.outputs.release_plan }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME=$(printf '%s' "$RELEASE_PLAN" | jq -er '.site.name')
          VERSION=$(printf '%s' "$RELEASE_PLAN" | jq -er '.site.version')
          SUMMARY=$(printf '%s' "$RELEASE_PLAN" | jq -er '.site.summary')
          ARTIFACT=site ARTIFACT_NAME="$ARTIFACT_NAME" VERSION="$VERSION" SUMMARY="$SUMMARY" \
            node .tools/scripts/release-notifier.mjs open

  release:
    needs: [prepare, announce]
    if: ${{ needs.prepare.outputs.mobile_platforms != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.mobile_platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
      - name: Checkout release-actions tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          repository: ${{ env.ACTIONS_REPO }}
          ref: ${{ env.ACTIONS_REF }}
          path: .tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7
        with:
          node-version: "24"
      - name: Install project dependencies
        run: .tools/scripts/install-project-deps.sh
      - run: npm install -g eas-cli
      - name: Post build triggered
        if: ${{ !inputs.skip_build }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_discord_thread_id || needs.announce.outputs.android_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: build
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          PLATFORM: ${{ matrix.platform }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_slack_thread_ts || needs.announce.outputs.android_slack_thread_ts }}
          STATUS: triggered
        run: node .tools/scripts/release-notifier.mjs reply
      - name: Resolve the exact EAS build
        id: select_build
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          SKIP_BUILD: ${{ inputs.skip_build }}
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          APP_CONFIG=$(npx --no-install expo config --type public --json)
          APP_VERSION=$(printf '%s' "$APP_CONFIG" | jq -er '.version | select(type == "string" and length > 0)')
          PROJECT_ID=$(printf '%s' "$APP_CONFIG" | jq -er '.extra.eas.projectId | select(type == "string" and length > 0)')
          GIT_COMMIT_HASH=$(git rev-parse HEAD)
          if [ "$PLATFORM" = "ios" ]; then
            APP_IDENTIFIER=$(printf '%s' "$APP_CONFIG" | jq -er '.ios.bundleIdentifier | select(type == "string" and length > 0)')
          else
            APP_IDENTIFIER=$(printf '%s' "$APP_CONFIG" | jq -er '.android.package | select(type == "string" and length > 0)')
          fi
          SELECT_ARGS=(select --platform "$PLATFORM" --build-profile "$BUILD_PROFILE")
          SELECT_ARGS+=(--project-id "$PROJECT_ID" --app-version "$APP_VERSION")
          SELECT_ARGS+=(--git-commit-hash "$GIT_COMMIT_HASH")
          if [ "$SKIP_BUILD" = "true" ]; then SELECT_ARGS+=(--skip-build); fi
          SELECTED=$(node .tools/scripts/exact-eas-release.mjs "${SELECT_ARGS[@]}")
          BUILD_ID=$(printf '%s' "$SELECTED" | jq -er '.id | select(type == "string" and length > 0)')
          URL=$(printf '%s' "$SELECTED" | jq -r '.url // empty')
          APP_BUILD_VERSION=$(printf '%s' "$SELECTED" | jq -er '.appBuildVersion | select(type == "string" and length > 0)')
          echo "Resolved EAS build ID: $BUILD_ID"
          echo "Resolved EAS app identifier: $APP_IDENTIFIER"
          echo "Resolved EAS project ID: $PROJECT_ID"
          echo "Resolved EAS git commit: $GIT_COMMIT_HASH"
          echo "Resolved EAS app version: $APP_VERSION"
          echo "Resolved EAS build number: $APP_BUILD_VERSION"
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Post build completed
        if: ${{ !inputs.skip_build && steps.select_build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_discord_thread_id || needs.announce.outputs.android_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: build
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          PLATFORM: ${{ matrix.platform }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_slack_thread_ts || needs.announce.outputs.android_slack_thread_ts }}
          STATUS: completed
          URL: ${{ steps.select_build.outputs.url }}
        run: node .tools/scripts/release-notifier.mjs reply
      - name: Post build skipped
        if: ${{ inputs.skip_build && steps.select_build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_discord_thread_id || needs.announce.outputs.android_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: build
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          PLATFORM: ${{ matrix.platform }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_slack_thread_ts || needs.announce.outputs.android_slack_thread_ts }}
          STATUS: skipped
        run: node .tools/scripts/release-notifier.mjs reply
      - name: Post build selection failed
        if: ${{ failure() && steps.select_build.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_discord_thread_id || needs.announce.outputs.android_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: selection
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          PLATFORM: ${{ matrix.platform }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_slack_thread_ts || needs.announce.outputs.android_slack_thread_ts }}
          STATUS: failed
        run: node .tools/scripts/release-notifier.mjs reply
      - name: Materialize Android service account
        if: ${{ matrix.platform == 'android' && steps.select_build.outcome == 'success' }}
        shell: bash
        env:
          ANDROID_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          ANDROID_SERVICE_ACCOUNT_KEY_PATH: ${{ runner.temp }}/android-service-account.json
        run: |
          set -euo pipefail
          test -n "$ANDROID_SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$ANDROID_SERVICE_ACCOUNT_JSON" > "$ANDROID_SERVICE_ACCOUNT_KEY_PATH"
          jq -e 'type == "object" and .type == "service_account"' "$ANDROID_SERVICE_ACCOUNT_KEY_PATH" >/dev/null
          echo "ANDROID_SERVICE_ACCOUNT_KEY_PATH=$ANDROID_SERVICE_ACCOUNT_KEY_PATH" >> "$GITHUB_ENV"
      - name: Post submit triggered
        if: ${{ steps.select_build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_discord_thread_id || needs.announce.outputs.android_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: submit
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          PLATFORM: ${{ matrix.platform }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_slack_thread_ts || needs.announce.outputs.android_slack_thread_ts }}
          STATUS: triggered
        run: node .tools/scripts/release-notifier.mjs reply
      - name: EAS submit
        id: submit
        if: ${{ steps.select_build.outcome == 'success' }}
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          SUBMIT_PROFILE: ${{ inputs.submit_profile }}
          BUILD_ID: ${{ steps.select_build.outputs.id }}
        run: node .tools/scripts/exact-eas-release.mjs submit --platform "$PLATFORM" --submit-profile "$SUBMIT_PROFILE" --build-id "$BUILD_ID"
      - name: Remove Android service account
        if: ${{ always() && matrix.platform == 'android' }}
        shell: bash
        env:
          ANDROID_SERVICE_ACCOUNT_KEY_PATH: ${{ runner.temp }}/android-service-account.json
        run: rm -f "$ANDROID_SERVICE_ACCOUNT_KEY_PATH"
      - name: Post submit completed
        if: ${{ steps.submit.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_discord_thread_id || needs.announce.outputs.android_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: submit
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          PLATFORM: ${{ matrix.platform }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_slack_thread_ts || needs.announce.outputs.android_slack_thread_ts }}
          STATUS: completed
        run: node .tools/scripts/release-notifier.mjs reply
      - name: Post submit failed
        if: ${{ failure() && steps.submit.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_discord_thread_id || needs.announce.outputs.android_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: submit
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          PLATFORM: ${{ matrix.platform }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ matrix.platform == 'ios' && needs.announce.outputs.ios_slack_thread_ts || needs.announce.outputs.android_slack_thread_ts }}
          STATUS: failed
        run: node .tools/scripts/release-notifier.mjs reply

  site:
    needs: [prepare, announce]
    if: ${{ needs.prepare.outputs.should_deploy_site == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
      - name: Checkout release-actions tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          repository: ${{ env.ACTIONS_REPO }}
          ref: ${{ env.ACTIONS_REF }}
          path: .tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7
        with:
          node-version: "24"
      - name: Install project dependencies
        run: .tools/scripts/install-project-deps.sh
      - name: Post site deployment triggered
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ needs.announce.outputs.site_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: deploy
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          PLATFORM: site
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.site_slack_thread_ts }}
          STATUS: triggered
        run: node .tools/scripts/release-notifier.mjs reply
      - name: Package static site without provider credentials
        id: package_site
        shell: bash
        env:
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.site_supabase_publishable_key }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ inputs.site_supabase_url }}
          SHOTSTEP_ANDROID_RELEASE_SHA256: ${{ inputs.site_android_release_sha256 }}
          SITE_BUILD_COMMAND: ${{ inputs.site_build_command }}
          SITE_OUTPUT_DIRECTORY: ${{ inputs.site_output_directory }}
          SITE_PACKAGE_DIRECTORY: ${{ inputs.site_package_directory }}
        run: |
          set -euo pipefail
          test -n "$SITE_BUILD_COMMAND"
          test -n "$SITE_OUTPUT_DIRECTORY"
          test -n "$SITE_PACKAGE_DIRECTORY"
          SOURCE_REVISION=$(git rev-parse HEAD)
          node .tools/scripts/static-site-artifact.mjs build \
            --command "$SITE_BUILD_COMMAND" \
            --output-directory "$SITE_OUTPUT_DIRECTORY" \
            --package-directory "$SITE_PACKAGE_DIRECTORY" \
            --source-revision "$SOURCE_REVISION"
      - name: Publish static site to Cloudflare Pages
        id: publish_site
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_DEPLOYMENT_BRANCH: ${{ inputs.site_deployment_branch }}
          SITE_PACKAGE_DIRECTORY: ${{ inputs.site_package_directory }}
          SITE_PRODUCTION_BRANCH: ${{ inputs.site_production_branch }}
          SITE_PROJECT_NAME: ${{ inputs.site_project_name }}
        run: |
          set -euo pipefail
          test -n "$SITE_PROJECT_NAME"
          test -n "$SITE_DEPLOYMENT_BRANCH"
          test -n "$SITE_PRODUCTION_BRANCH"
          DEPLOYMENT=$(node .tools/scripts/cloudflare-pages-publisher.mjs \
            --package-directory "$SITE_PACKAGE_DIRECTORY" \
            --project-name "$SITE_PROJECT_NAME" \
            --deployment-branch "$SITE_DEPLOYMENT_BRANCH" \
            --production-branch "$SITE_PRODUCTION_BRANCH")
          echo "url=$(printf '%s' "$DEPLOYMENT" | jq -er '.url')" >> "$GITHUB_OUTPUT"
      - name: Post site deployment completed
        if: ${{ steps.publish_site.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ needs.announce.outputs.site_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: deploy
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          PLATFORM: site
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.site_slack_thread_ts }}
          STATUS: completed
          URL: ${{ steps.publish_site.outputs.url }}
        run: node .tools/scripts/release-notifier.mjs reply
      - name: Post site deployment failed
        if: ${{ failure() }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ needs.announce.outputs.site_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: deploy
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          PLATFORM: site
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.site_slack_thread_ts }}
          STATUS: failed
        run: node .tools/scripts/release-notifier.mjs reply

  finalize:
    needs: [prepare, announce, release, site]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release-actions tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          repository: ${{ env.ACTIONS_REPO }}
          ref: ${{ env.ACTIONS_REF }}
          path: .tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7
        with:
          node-version: "24"
      - id: state
        name: Resolve final release state
        shell: bash
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MOBILE_RESULT: ${{ needs.release.result }}
          SITE_RESULT: ${{ needs.site.result }}
        run: |
          set -euo pipefail
          if [ "$PREPARE_RESULT" != "success" ]; then
            MOBILE_OK=false; MOBILE_STAGE="release preparation"
            SITE_OK=false; SITE_STAGE="release preparation"
          else
            if [ "$MOBILE_RESULT" = "failure" ] || [ "$MOBILE_RESULT" = "cancelled" ]; then
              MOBILE_OK=false; MOBILE_STAGE="mobile release"
            else
              MOBILE_OK=true; MOBILE_STAGE=""
            fi
            if [ "$SITE_RESULT" = "failure" ] || [ "$SITE_RESULT" = "cancelled" ]; then
              SITE_OK=false; SITE_STAGE="site deployment"
            else
              SITE_OK=true; SITE_STAGE=""
            fi
          fi
          if [ "$MOBILE_OK" = "true" ] && [ "$SITE_OK" = "true" ]; then OK=true; STAGE=""
          elif [ "$MOBILE_OK" != "true" ]; then OK=false; STAGE="$MOBILE_STAGE"
          else OK=false; STAGE="$SITE_STAGE"; fi
          echo "mobile_ok=$MOBILE_OK" >> "$GITHUB_OUTPUT"
          echo "mobile_stage=$MOBILE_STAGE" >> "$GITHUB_OUTPUT"
          echo "site_ok=$SITE_OK" >> "$GITHUB_OUTPUT"
          echo "site_stage=$SITE_STAGE" >> "$GITHUB_OUTPUT"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
      - name: Post final iOS release status
        if: ${{ contains(fromJSON(needs.prepare.outputs.mobile_platforms), 'ios') }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ needs.announce.outputs.ios_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          OK: ${{ steps.state.outputs.mobile_ok }}
          RELEASE_PLAN: ${{ needs.prepare.outputs.release_plan }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.ios_slack_thread_ts }}
          STAGE: ${{ steps.state.outputs.mobile_stage }}
        run: |
          ARTIFACT_NAME=$(printf '%s' "$RELEASE_PLAN" | jq -er '.ios.name')
          VERSION=$(printf '%s' "$RELEASE_PLAN" | jq -er '.ios.version')
          ARTIFACT_NAME="$ARTIFACT_NAME" VERSION="$VERSION" node .tools/scripts/release-notifier.mjs final
      - name: Post final Android release status
        if: ${{ contains(fromJSON(needs.prepare.outputs.mobile_platforms), 'android') }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ needs.announce.outputs.android_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          OK: ${{ steps.state.outputs.mobile_ok }}
          RELEASE_PLAN: ${{ needs.prepare.outputs.release_plan }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.android_slack_thread_ts }}
          STAGE: ${{ steps.state.outputs.mobile_stage }}
        run: |
          ARTIFACT_NAME=$(printf '%s' "$RELEASE_PLAN" | jq -er '.android.name')
          VERSION=$(printf '%s' "$RELEASE_PLAN" | jq -er '.android.version')
          ARTIFACT_NAME="$ARTIFACT_NAME" VERSION="$VERSION" node .tools/scripts/release-notifier.mjs final
      - name: Post final website release status
        if: ${{ needs.prepare.outputs.should_deploy_site == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_THREAD_ID: ${{ needs.announce.outputs.site_discord_thread_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFICATION_PUBLISHER: ${{ needs.prepare.outputs.notification_publisher }}
          OK: ${{ steps.state.outputs.site_ok }}
          RELEASE_PLAN: ${{ needs.prepare.outputs.release_plan }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.site_slack_thread_ts }}
          STAGE: ${{ steps.state.outputs.site_stage }}
        run: |
          ARTIFACT_NAME=$(printf '%s' "$RELEASE_PLAN" | jq -er '.site.name')
          VERSION=$(printf '%s' "$RELEASE_PLAN" | jq -er '.site.version')
          ARTIFACT_NAME="$ARTIFACT_NAME" VERSION="$VERSION" node .tools/scripts/release-notifier.mjs final
      - name: Report failed release
        if: ${{ steps.state.outputs.ok != 'true' }}
        shell: bash
        env:
          STAGE: ${{ steps.state.outputs.stage }}
        run: |
          echo "release failed at ${STAGE}" >&2
          exit 1
