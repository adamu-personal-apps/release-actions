name: Expo release

on:
  workflow_call:
    inputs:
      project_name: { type: string, required: true }
      profile: { type: string, required: true } # business | personal (label only)
      platform: { type: string, default: ios } # ios | android | all
      build_profile: { type: string, default: production }
      submit_profile: { type: string, default: production }
      version: { type: string, required: false }
      summary: { type: string, required: false }
      skip_build: { type: boolean, default: false }
      slack_channel_id: { type: string, required: false }
    secrets:
      EXPO_TOKEN: { required: true }
      SLACK_BOT_TOKEN: { required: false }

env:
  ACTIONS_REPO: adamu-personal-apps/release-actions
  ACTIONS_REF: 83d713a58f5f78037fc83adeb42d237436c71dfb

jobs:
  announce:
    runs-on: ubuntu-latest
    outputs:
      slack_thread_ts: ${{ steps.open_slack.outputs.thread_ts }}
      version: ${{ steps.ver.outputs.version }}
      platforms: ${{ steps.plat.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with: { fetch-depth: 0 }
      - name: Checkout release-actions tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          repository: ${{ env.ACTIONS_REPO }}
          ref: ${{ env.ACTIONS_REF }}
          path: .tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7
        with:
          node-version: "24"

      - id: ver
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -n "$IN_VERSION" ]; then V="$IN_VERSION"
          elif [ "$REF_TYPE" = "tag" ]; then V="${REF_NAME#v}"
          else V=$(node -p "require('./package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - id: plat
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            ios) P='["ios"]';;
            android) P='["android"]';;
            all) P='["ios","android"]';;
            *) echo "bad platform: $PLATFORM" >&2; exit 1;;
          esac
          echo "platforms=$P" >> "$GITHUB_OUTPUT"

      - id: sum
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          IN_SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          if [ -n "$IN_SUMMARY" ]; then
            SUMMARY="$IN_SUMMARY"
          else
            CURRENT_TAG="v${VERSION}"
            if git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then REF="$CURRENT_TAG"; else REF="HEAD"; fi
            if PREV=$(git describe --tags --abbrev=0 "${REF}^" 2>/dev/null); then RANGE="${PREV}..${REF}"; else RANGE="${REF}"; fi
            SUBJECTS=$(git log "$RANGE" --pretty=format:'%s')
            SUMMARY=$(printf '%s' "$SUBJECTS" | node .tools/scripts/summary-cli.mjs)
          fi
          { echo 'summary<<__EOF__'; echo "$SUMMARY"; echo '__EOF__'; } >> "$GITHUB_OUTPUT"

      - id: open_slack
        name: Open Slack release thread
        continue-on-error: true
        shell: bash
        env:
          PROJECT_NAME: ${{ inputs.project_name }}
          VERSION: ${{ steps.ver.outputs.version }}
          PROFILE: ${{ inputs.profile }}
          SUMMARY: ${{ steps.sum.outputs.summary }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$IS_MANUAL" = "true" ]; then TRIGGER="manual"; else TRIGGER="auto: tag v${VERSION}"; fi
          SLACK_TEXT=$(TRIGGER="$TRIGGER" node .tools/scripts/payload-cli.mjs slack-open)
          SLACK_TEXT="$SLACK_TEXT" node .tools/scripts/slack-cli.mjs open

  release:
    needs: announce
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.announce.outputs.platforms) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
      - name: Checkout release-actions tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          repository: ${{ env.ACTIONS_REPO }}
          ref: ${{ env.ACTIONS_REF }}
          path: .tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7
        with:
          node-version: "24"
      - name: Install project dependencies
        run: .tools/scripts/install-project-deps.sh
      - run: npm install -g eas-cli

      - name: Post Slack build triggered
        if: ${{ !inputs.skip_build }}
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.slack_thread_ts }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=build STATUS=triggered node .tools/scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node .tools/scripts/slack-cli.mjs reply

      - name: Resolve the exact EAS build
        id: select_build
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          SKIP_BUILD: ${{ inputs.skip_build }}
        run: |
          set -euo pipefail
          APP_CONFIG=$(npx --no-install expo config --type public --json)
          APP_VERSION=$(printf '%s' "$APP_CONFIG" | jq -er '.version | select(type == "string" and length > 0)')
          if [ "$PLATFORM" = "ios" ]; then
            APP_IDENTIFIER=$(printf '%s' "$APP_CONFIG" | jq -er '.ios.bundleIdentifier | select(type == "string" and length > 0)')
          else
            APP_IDENTIFIER=$(printf '%s' "$APP_CONFIG" | jq -er '.android.package | select(type == "string" and length > 0)')
          fi
          SELECT_ARGS=(select --platform "$PLATFORM" --build-profile "$BUILD_PROFILE")
          SELECT_ARGS+=(--app-identifier "$APP_IDENTIFIER" --app-version "$APP_VERSION")
          if [ "$SKIP_BUILD" = "true" ]; then
            SELECT_ARGS+=(--skip-build)
          fi
          SELECTED=$(node .tools/scripts/exact-eas-release.mjs "${SELECT_ARGS[@]}")
          BUILD_ID=$(printf '%s' "$SELECTED" | jq -er '.id | select(type == "string" and length > 0)')
          URL=$(printf '%s' "$SELECTED" | jq -r '.url // empty')
          APP_BUILD_VERSION=$(printf '%s' "$SELECTED" | jq -er '.appBuildVersion | select(type == "string" and length > 0)')
          echo "Resolved EAS build ID: $BUILD_ID"
          echo "Resolved EAS app identifier: $APP_IDENTIFIER"
          echo "Resolved EAS app version: $APP_VERSION"
          echo "Resolved EAS build number: $APP_BUILD_VERSION"
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Post Slack build completed
        if: ${{ !inputs.skip_build && success() }}
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.slack_thread_ts }}
          PLATFORM: ${{ matrix.platform }}
          URL: ${{ steps.select_build.outputs.url }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=build STATUS=completed node .tools/scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node .tools/scripts/slack-cli.mjs reply

      - name: Post Slack build failed
        if: ${{ !inputs.skip_build && failure() }}
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.slack_thread_ts }}
          PLATFORM: ${{ matrix.platform }}
          URL: ${{ steps.select_build.outputs.url }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=build STATUS=failed node .tools/scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node .tools/scripts/slack-cli.mjs reply

      - name: Post Slack build-skipped notice
        if: ${{ inputs.skip_build && steps.select_build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.slack_thread_ts }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=build STATUS=skipped node .tools/scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node .tools/scripts/slack-cli.mjs reply

      - name: Post Slack build selection failed
        if: ${{ failure() && inputs.skip_build && steps.select_build.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.slack_thread_ts }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=selection STATUS=failed node .tools/scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node .tools/scripts/slack-cli.mjs reply

      - name: Post Slack submit triggered
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.slack_thread_ts }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=submit STATUS=triggered node .tools/scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node .tools/scripts/slack-cli.mjs reply

      - name: EAS submit
        id: submit
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
          SUBMIT_PROFILE: ${{ inputs.submit_profile }}
          BUILD_ID: ${{ steps.select_build.outputs.id }}
        run: |
          set -euo pipefail
          node .tools/scripts/exact-eas-release.mjs submit --platform "$PLATFORM" --submit-profile "$SUBMIT_PROFILE" --build-id "$BUILD_ID"

      - name: Post Slack submit completed
        if: ${{ steps.submit.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.slack_thread_ts }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=submit STATUS=completed node .tools/scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node .tools/scripts/slack-cli.mjs reply

      - name: Post Slack submit failed
        if: ${{ failure() && steps.submit.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.slack_thread_ts }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(EVENT=submit STATUS=failed node .tools/scripts/payload-cli.mjs slack-update)
          SLACK_TEXT="$SLACK_TEXT" node .tools/scripts/slack-cli.mjs reply

  finalize:
    needs: [announce, release]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release-actions tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # checkout v7
        with:
          repository: ${{ env.ACTIONS_REPO }}
          ref: ${{ env.ACTIONS_REF }}
          path: .tools
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # setup-node v7
        with:
          node-version: "24"

      - id: state
        name: Resolve final release state
        shell: bash
        env:
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_RESULT" = "success" ]; then OK=true; STAGE="";
          else OK=false; STAGE="release"; fi
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Post Slack final status
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ inputs.slack_channel_id }}
          SLACK_THREAD_TS: ${{ needs.announce.outputs.slack_thread_ts }}
          VERSION: ${{ needs.announce.outputs.version }}
          OK: ${{ steps.state.outputs.ok }}
          STAGE: ${{ steps.state.outputs.stage }}
        run: |
          set -euo pipefail
          SLACK_TEXT=$(node .tools/scripts/payload-cli.mjs slack-final)
          SLACK_TEXT="$SLACK_TEXT" node .tools/scripts/slack-cli.mjs reply

      - name: Report failed release
        if: ${{ always() && steps.state.outputs.ok != 'true' }}
        shell: bash
        env:
          STAGE: ${{ steps.state.outputs.stage }}
        run: |
          echo "release failed at ${STAGE}" >&2
          exit 1
